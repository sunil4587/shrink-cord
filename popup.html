<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DiscordShrink Settings</title>
  <style>
    @font-face {
      font-family: "gg sans";
      font-style: normal;
      font-weight: 400;
      src: url("https://cdn.jsdelivr.net/gh/Tyrrrz/DiscordFonts@master/ggsans-normal-400.woff2") format("woff2");
    }
    @font-face {
      font-family: "gg sans";
      font-style: normal;
      font-weight: 600;
      src: url("https://cdn.jsdelivr.net/gh/Tyrrrz/DiscordFonts@master/ggsans-normal-600.woff2") format("woff2");
    }
    @font-face {
      font-family: "gg sans";
      font-style: normal;
      font-weight: 700;
      src: url("https://cdn.jsdelivr.net/gh/Tyrrrz/DiscordFonts@master/ggsans-normal-700.woff2") format("woff2");
    }

    body {
      margin: 0;
      padding: 0;
      width: 300px;
      font-family: "gg sans", "Noto Sans", "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      background-color: #313338;
      color: #dbdee1;
      user-select: none;
    }

    .header {
      padding: 12px 16px;
      background-color: #2b2d31;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .header-logo {
      width: 24px;
      height: 24px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
    }

    .title {
      font-size: 14px;
      font-weight: 700;
      color: #f2f3f5;
      margin: 0;
    }

    .badge {
      font-size: 10px;
      font-weight: 700;
      color: #23a55a;
      background-color: rgba(35, 165, 90, 0.15);
      padding: 2px 6px;
      border-radius: 3px;
      letter-spacing: 0.3px;
    }

    .content {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .status-card {
      background-color: #2b2d31;
      border-radius: 4px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background-color: #23a55a;
      border-radius: 50%;
    }

    .status-text {
      font-size: 12px;
      color: #949ba4;
    }

    .setting-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #b5bac1;
    }

    select {
      background-color: #1e1f22;
      color: #dbdee1;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      height: 36px;
      padding: 0 10px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: #5865f2;
    }

    .footer {
      padding: 10px 16px;
      background-color: #2b2d31;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .link {
      font-size: 12px;
      color: #00a8fc;
      text-decoration: none;
    }

    .link:hover {
      text-decoration: underline;
    }

    .version {
      font-size: 11px;
      color: #80848e;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <img src="icons/icon48.png" class="header-logo" alt="DiscordShrink Logo" />
      <h1 class="title">DiscordShrink</h1>
    </div>
    <span class="badge">ACTIVE</span>
  </div>

  <div class="content">
    <div class="status-card">
      <div class="status-dot"></div>
      <span class="status-text">Active for &gt;20MB video &amp; audio on Discord Web</span>
    </div>

    <div class="setting-group">
      <label class="label" for="default-size">Default Target Size</label>
      <select id="default-size">
        <option value="19.0">19.0 MB — Discord Safe Limit</option>
        <option value="15.0">15.0 MB — WhatsApp / Mobile Safe</option>
        <option value="8.0">8.0 MB — Legacy Discord Size</option>
      </select>
    </div>

    <div class="setting-group">
      <label class="label" for="default-quality">Default Resolution</label>
      <select id="default-quality">
        <option value="720">720p HD (Balanced)</option>
        <option value="480">480p SD (Fast)</option>
        <option value="original">Original Resolution</option>
      </select>
    </div>
  </div>

  <div class="footer">
    <a href="https://github.com/discord-shrink" target="_blank" class="link">GitHub</a>
    <span class="version">v1.2.0</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
