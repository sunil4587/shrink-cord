<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShrinkCord Settings</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 280px;
      font-family: "gg sans", "Noto Sans", "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #313338;
      color: #dbdee1;
      user-select: none;
    }

    .header {
      padding: 10px 14px;
      background-color: #2b2d31;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-logo {
      width: 26px;
      height: 26px;
      object-fit: contain;
    }

    .title {
      font-size: 13.5px;
      font-weight: 700;
      color: #f2f3f5;
      margin: 0;
    }

    .badge {
      font-size: 9.5px;
      font-weight: 700;
      color: #23a55a;
      background-color: rgba(35, 165, 90, 0.15);
      padding: 2px 6px;
      border-radius: 3px;
    }

    .content {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .status-card {
      background-color: #2b2d31;
      border-radius: 4px;
      padding: 7px 9px;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11.5px;
      color: #949ba4;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background-color: #23a55a;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .setting-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .label {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: #b5bac1;
    }

    select {
      background-color: #1e1f22;
      color: #dbdee1;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      height: 32px;
      padding: 0 8px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: #5865f2;
    }

    .tip-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
    }

    .bmc-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background-color: #FFDD00;
      color: #000000;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      padding: 7px 10px;
      border-radius: 4px;
      transition: background-color 0.15s ease;
    }

    .bmc-button:hover {
      background-color: #ffea47;
    }

    .footer {
      padding: 8px 14px;
      background-color: #2b2d31;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .link {
      font-size: 11px;
      color: #00a8fc;
      text-decoration: none;
    }

    .link:hover {
      text-decoration: underline;
    }

    .version {
      font-size: 10.5px;
      color: #80848e;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <img src="icons/icon48.png" class="header-logo" alt="ShrinkCord Logo" />
      <h1 class="title">ShrinkCord</h1>
    </div>
    <span class="badge">ACTIVE</span>
  </div>

  <div class="content">
    <div class="status-card">
      <div class="status-dot"></div>
      <span>Active &amp; ready to compress</span>
    </div>

    <div class="setting-group">
      <label class="label" for="default-size">Default Target Size</label>
      <select id="default-size">
        <option value="19.0">19 MB — Discord Free Limit</option>
        <option value="48.0">48 MB — Nitro Basic Limit</option>
        <option value="8.0">8 MB — Compact Size</option>
      </select>
    </div>

    <div class="setting-group">
      <label class="label" for="default-format">Default Video Format</label>
      <select id="default-format">
        <option value="mp4">MP4 (Universal — iOS, Android &amp; PC)</option>
        <option value="webm">WebM (Fast)</option>
      </select>
    </div>

    <div class="setting-group">
      <label class="label" for="default-quality">Default Max Resolution</label>
      <select id="default-quality">
        <option value="1080">Auto (1080p FHD)</option>
        <option value="720">720p HD</option>
        <option value="480">480p SD</option>
      </select>
    </div>

    <div class="tip-actions">
      <a href="https://www.buymeacoffee.com/isaac4096" target="_blank" rel="noopener noreferrer" class="bmc-button">
        ☕ <span>Buy me a coffee</span>
      </a>
    </div>
  </div>

  <div class="footer">
    <a href="https://github.com/Isaac4096/shrink-cord" target="_blank" class="link">GitHub</a>
    <span class="version">v1.2.0</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
